[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsh-photo"
version = "0.1.0"
description = "Batch-match RAW photos with JPEGs by filename and archive the matches."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "GUIDchen" }]
keywords = ["photography", "raw", "jpeg", "cr3", "culling", "archive"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Graphics",
]
dependencies = []

[project.scripts]
dsh-photo = "dsh_photo.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/GUIDchen/dsh-photo"
Repository = "https://github.com/GUIDchen/dsh-photo"
"Bug Tracker" = "https://github.com/GUIDchen/dsh-photo/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
